<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Vecta</h1>
      <p class="subtitle">Geopolitical context for the companies you're watching.</p>
    </div>
    <div class="account">
      <span>{{ current_user.email }}</span>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </header>

  <main>
    <section class="briefing">
      <h2>Watchlist Briefing</h2>
      <p class="briefing-hint">How geopolitical events might relate to your specific list of companies — not investment advice.</p>
      <button id="briefing-btn">Get briefing</button>
      <div id="briefing-result"></div>
    </section>

    <section class="add-holding">
      <h2>Watch a company</h2>
      <form id="add-form">
        <input type="text" id="symbol" placeholder="Ticker (e.g. AAPL)" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="holdings">
      <h2>Your Watchlist</h2>
      <table id="holdings-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Price</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="holdings-body"></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
